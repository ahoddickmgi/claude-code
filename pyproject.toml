[project]
name = "sales-agent"
version = "0.1.0"
description = "A sales agent that queries inventory and submits orders to CSRs via email"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40.0",
    "flask>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
sales-agent = "sales_agent.main:main"
affiliate-posts = "affiliate_app.app:main"
